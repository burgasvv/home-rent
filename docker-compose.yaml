
services:

  postgres:
    image: postgres:latest
    container_name: home-rent-postgres
    environment:
      POSTGRES_DB: home-rent-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5000:5432"
    networks:
      - my-network
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:latest
    container_name: home-rent-redis
    ports:
      - "6000:6379"
    networks:
      - my-network
    volumes:
      - redis-data:/var/lib/redis

  home-rent:
    container_name: home-rent
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    networks:
      - my-network
    ports:
      - "9000:9000"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/home-rent-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379

networks:
  my-network:
    external: true

volumes:
  postgres-data:
  redis-data:
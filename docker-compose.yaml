
services:

  postgres:
    image: postgres:latest
    container_name: home-rent-postgres
    environment:
      POSTGRES_DB: home-rent-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5000:5432"
    networks:
      - my-network
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:latest
    container_name: home-rent-redis
    ports:
      - "6000:6379"
    networks:
      - my-network
    volumes:
      - redis-data:/var/lib/redis

networks:
  my-network:
    external: true

volumes:
  postgres-data:
  redis-data:
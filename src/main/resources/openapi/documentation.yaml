components:
  parameters:
    OriginHeader:
      name: Origin
      in: header
      required: false
      description: Домен, с которого отправляется запрос (передается браузером автоматически)
      schema:
        type: string
        example: http://localhost:9000
  schemas:
    ExceptionResponse:
      type: "object"
      properties:
        status:
          type: "string"
        code:
          type: "integer"
          format: "int32"
        message:
          type: "string"
          nullable: true
      required:
        - "status"
        - "code"
    Uuid:
      type: "object"
      properties:
        mostSignificantBits:
          type: "integer"
          format: "int64"
        leastSignificantBits:
          type: "integer"
          format: "int64"
      required:
        - "mostSignificantBits"
        - "leastSignificantBits"
    ImageDependency:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: "string"
          nullable: true
        contentType:
          type: "string"
      required:
        - "id"
        - "contentType"
    AddressDependency:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        country:
          type: "string"
        city:
          type: "string"
        street:
          type: "string"
        building:
          type: "string"
        apartment:
          type: "string"
          nullable: true
      required:
        - "id"
        - "country"
        - "city"
        - "street"
        - "building"
    IdentityDependency:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          type: "string"
        phone:
          type: "string"
        telegram:
          type: "string"
          nullable: true
        whatsapp:
          type: "string"
          nullable: true
        max:
          type: "string"
          nullable: true
        firstname:
          type: "string"
        lastname:
          type: "string"
        patronymic:
          type: "string"
        image:
          nullable: true
          $ref: "#/components/schemas/ImageDependency"
      required:
        - "id"
        - "email"
        - "phone"
        - "firstname"
        - "lastname"
        - "patronymic"
    HomeDependencyWithTenant:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        homeType:
          type: "string"
          enum:
            - "APARTMENT"
            - "HOUSE"
            - "CONDO"
            - "TOWNHOUSE"
            - "MANOR"
        address:
          $ref: "#/components/schemas/AddressDependency"
        description:
          type: "string"
          nullable: true
        billingUnit:
          type: "string"
          enum:
            - "HOURLY"
            - "DAILY"
            - "MONTHLY"
            - "YEARLY"
        price:
          type: "number"
          format: "double"
        tenant:
          nullable: true
          $ref: "#/components/schemas/IdentityDependency"
        image:
          nullable: true
          $ref: "#/components/schemas/ImageDependency"
      required:
        - "id"
        - "homeType"
        - "address"
        - "billingUnit"
        - "price"
    HomeDependencyWithLessor:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        homeType:
          type: "string"
          enum:
            - "APARTMENT"
            - "HOUSE"
            - "CONDO"
            - "TOWNHOUSE"
            - "MANOR"
        address:
          $ref: "#/components/schemas/AddressDependency"
        description:
          type: "string"
          nullable: true
        billingUnit:
          type: "string"
          enum:
            - "HOURLY"
            - "DAILY"
            - "MONTHLY"
            - "YEARLY"
        price:
          type: "number"
          format: "double"
        lessor:
          $ref: "#/components/schemas/IdentityDependency"
        image:
          nullable: true
          $ref: "#/components/schemas/ImageDependency"
      required:
        - "id"
        - "homeType"
        - "address"
        - "billingUnit"
        - "price"
        - "lessor"
    HomeDependency:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        homeType:
          type: "string"
          enum:
            - "APARTMENT"
            - "HOUSE"
            - "CONDO"
            - "TOWNHOUSE"
            - "MANOR"
        address:
          $ref: "#/components/schemas/AddressDependency"
        description:
          type: "string"
          nullable: true
        billingUnit:
          type: "string"
          enum:
            - "HOURLY"
            - "DAILY"
            - "MONTHLY"
            - "YEARLY"
        price:
          type: "number"
          format: "double"
        lessor:
          $ref: "#/components/schemas/IdentityDependency"
        tenant:
          nullable: true
          $ref: "#/components/schemas/IdentityDependency"
        image:
          nullable: true
          $ref: "#/components/schemas/ImageDependency"
      required:
        - "id"
        - "homeType"
        - "address"
        - "billingUnit"
        - "price"
        - "lessor"
    MeetingDependencyInApplicant:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        home:
          $ref: "#/components/schemas/HomeDependency"
        datetime:
          type: "string"
          format: "date-time"
        tookPlace:
          type: "boolean"
      required:
        - "id"
        - "home"
        - "datetime"
        - "tookPlace"
    IdentityResponse:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          type: "string"
        phone:
          type: "string"
        telegram:
          type: "string"
          nullable: true
        whatsapp:
          type: "string"
          nullable: true
        max:
          type: "string"
          nullable: true
        firstname:
          type: "string"
        lastname:
          type: "string"
        patronymic:
          type: "string"
        image:
          nullable: true
          $ref: "#/components/schemas/ImageDependency"
        homesByLessor:
          type: "array"
          items:
            $ref: "#/components/schemas/HomeDependencyWithTenant"
        homesByTenant:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/HomeDependencyWithLessor"
        meetings:
          type: "array"
          items:
            $ref: "#/components/schemas/MeetingDependencyInApplicant"
      required:
        - "id"
        - "email"
        - "phone"
        - "firstname"
        - "lastname"
        - "patronymic"
        - "homesByLessor"
        - "meetings"
    AuthRequest:
      type: "object"
      properties:
        email:
          type: "string"
        password:
          type: "string"
      required:
        - "email"
        - "password"
    IdentityRequest:
      type: "object"
      properties:
        id:
          type: "string"
          nullable: true
        authority:
          type: "string"
          nullable: true
          enum:
            - "ADMIN"
            - "USER"
        email:
          type: "string"
          nullable: true
        password:
          type: "string"
          nullable: true
        status:
          type: "boolean"
          nullable: true
        phone:
          type: "string"
          nullable: true
        telegram:
          type: "string"
          nullable: true
        whatsapp:
          type: "string"
          nullable: true
        max:
          type: "string"
          nullable: true
        firstname:
          type: "string"
          nullable: true
        lastname:
          type: "string"
          nullable: true
        patronymic:
          type: "string"
          nullable: true
    VideoDependency:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: "string"
          nullable: true
        contentType:
          type: "string"
      required:
        - "id"
        - "contentType"
    MeetingDependencyInHome:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        applicant:
          $ref: "#/components/schemas/IdentityDependency"
        datetime:
          type: "string"
          format: "date-time"
        tookPlace:
          type: "boolean"
      required:
        - "id"
        - "applicant"
        - "datetime"
        - "tookPlace"
    HomeResponse:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        homeType:
          type: "string"
          enum:
            - "APARTMENT"
            - "HOUSE"
            - "CONDO"
            - "TOWNHOUSE"
            - "MANOR"
        address:
          $ref: "#/components/schemas/AddressDependency"
        description:
          type: "string"
          nullable: true
        billingUnit:
          type: "string"
          enum:
            - "HOURLY"
            - "DAILY"
            - "MONTHLY"
            - "YEARLY"
        price:
          type: "number"
          format: "double"
        lessor:
          $ref: "#/components/schemas/IdentityDependency"
        tenant:
          nullable: true
          $ref: "#/components/schemas/IdentityDependency"
        image:
          nullable: true
          $ref: "#/components/schemas/ImageDependency"
        images:
          type: "array"
          items:
            $ref: "#/components/schemas/ImageDependency"
        videos:
          type: "array"
          items:
            $ref: "#/components/schemas/VideoDependency"
        meetings:
          type: "array"
          items:
            $ref: "#/components/schemas/MeetingDependencyInHome"
      required:
        - "id"
        - "homeType"
        - "address"
        - "billingUnit"
        - "price"
        - "lessor"
        - "images"
        - "videos"
        - "meetings"
    AddressRequest:
      type: "object"
      properties:
        id:
          type: "string"
          nullable: true
        country:
          type: "string"
          nullable: true
        city:
          type: "string"
          nullable: true
        street:
          type: "string"
          nullable: true
        building:
          type: "string"
          nullable: true
        apartment:
          type: "string"
          nullable: true
    HomeRequest:
      type: "object"
      properties:
        id:
          type: "string"
          nullable: true
        homeType:
          type: "string"
          nullable: true
          enum:
            - "APARTMENT"
            - "HOUSE"
            - "CONDO"
            - "TOWNHOUSE"
            - "MANOR"
        address:
          nullable: true
          $ref: "#/components/schemas/AddressRequest"
        description:
          type: "string"
          nullable: true
        billingUnit:
          type: "string"
          nullable: true
          enum:
            - "HOURLY"
            - "DAILY"
            - "MONTHLY"
            - "YEARLY"
        price:
          type: "number"
          format: "double"
          nullable: true
        lessorId:
          type: "string"
